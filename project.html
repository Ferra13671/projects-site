<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка проекта...</title>
    <link rel="icon" href="https://github.com/Ferra13671.png" type="image/png">
    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Prism.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-main: #e6e6e6;
            --text-muted: #9e9e9e;
            --card-bg: #252525;
            --border-color: #333333;
            --accent: #4a90e2;
            --sidebar-width: 300px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Шапка и навигация */
        .project-header { width: 100%; height: 250px; background-color: var(--card-bg); background-size: cover; background-position: center; position: relative; border-bottom: 1px solid var(--border-color); display: flex; align-items: flex-end; padding: 30px 40px; flex-shrink: 0; }
        .project-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(26,26,26,1) 0%, rgba(26,26,26,0.4) 100%); z-index: 1; }
        .project-header h1 { position: relative; z-index: 2; font-size: 2.5rem; font-weight: 700; }
        .project-nav { display: flex; gap: 10px; padding: 20px 40px; border-bottom: 1px solid var(--border-color); background-color: var(--bg-color); flex-shrink: 0; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 6px; transition: color 0.2s, background-color 0.2s; text-decoration: none; }
        .nav-btn:hover { color: var(--text-main); background-color: var(--card-bg); }
        .nav-btn.active { color: var(--accent); background-color: rgba(74, 144, 226, 0.1); }

        /* Контейнер и сайдбар */
        .content-wrapper { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }
        .docs-sidebar { width: var(--sidebar-width); padding: 30px 20px; border-right: 1px solid var(--border-color); display: none; flex-shrink: 0; overflow-y: auto; }
        .docs-sidebar.visible { display: block; }
        .docs-group-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 20px 0 10px 10px; letter-spacing: 0.5px; }
        .docs-group-title:first-child { margin-top: 0; }
        .docs-link { display: block; padding: 6px 10px; color: var(--text-main); text-decoration: none; border-radius: 6px; font-size: 0.95rem; margin-bottom: 2px; cursor: pointer; }
        .docs-link:hover { background-color: var(--card-bg); }
        .docs-link.active { background-color: rgba(74, 144, 226, 0.15); color: var(--accent); font-weight: 600;}
        .project-content { flex: 1; padding: 40px 60px; max-width: 900px; overflow-y: auto; }
        .top-lang-switch { position: absolute; top: 20px; right: 20px; z-index: 10; }

        /* === СТИЛИ MARKDOWN === */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.5em; margin-bottom: 0.5em; color: #fff; }
        .markdown-body h1 { margin-top: 0; }
        .markdown-body p { margin-bottom: 1em; }
        .markdown-body a { color: var(--accent); text-decoration: none; cursor: pointer; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body ul, .markdown-body ol { margin-bottom: 1em; padding-left: 20px; }
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 10px 0; }

        /* Инлайн код (исправлен цвет) */
        .markdown-body code {
            background: #2d2d2d;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #e6e6e6; /* Спокойный светлый цвет */
            border: 1px solid #444;
        }

        /* Блоки кода */
        .markdown-body pre { background: #1e1e1e !important; padding: 20px; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5em; border: 1px solid #333; position: relative; }
        .markdown-body pre code { background: none; padding: 0; color: #e6e6e6; border: none; font-family: 'Fira Code', Consolas, Monaco, monospace; }

        /* Таблицы */
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; border: 1px solid var(--border-color); }
        .markdown-body th, .markdown-body td { padding: 10px 15px; border: 1px solid var(--border-color); text-align: left; }
        .markdown-body th { background-color: #1e1e1e; font-weight: 600; color: #fff; }
        .markdown-body tr:nth-child(even) { background-color: rgba(255,255,255,0.02); }

        /* Цветной текст */
        .text-orange { color: #e67e22; }
        .text-gray { color: #7f8c8d; }
        .text-red { color: #e74c3c; }
        .text-green { color: #2ecc71; }

        /* Hint блоки (Callouts) */
        .hint { display: flex; padding: 16px; border-radius: 8px; margin-bottom: 1.5em; border: 1px solid; gap: 12px; }
        .hint-icon { font-size: 1.2rem; line-height: 1.5; }
        .hint-content { flex: 1; }
        .hint-content p:last-child { margin-bottom: 0; }

        .hint-info { background-color: rgba(74, 144, 226, 0.1); border-color: rgba(74, 144, 226, 0.3); color: #9abde3; }
        .hint-success { background-color: rgba(46, 204, 113, 0.1); border-color: rgba(46, 204, 113, 0.3); color: #a3e4d7; }
        .hint-warning { background-color: rgba(241, 196, 15, 0.1); border-color: rgba(241, 196, 15, 0.3); color: #f7dc6f; }
        .hint-danger { background-color: rgba(231, 76, 60, 0.1); border-color: rgba(231, 76, 60, 0.3); color: #f1948a; }

        /* Табы (Tabs) */
        .tabs-container { margin-bottom: 1.5em; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .tabs-nav { display: flex; background: #1e1e1e; border-bottom: 1px solid var(--border-color); }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px 20px; cursor: pointer; font-size: 0.95rem; border-right: 1px solid var(--border-color); }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tab-btn.active { background: var(--card-bg); color: var(--accent); border-bottom: 2px solid var(--accent); margin-bottom: -1px; font-weight: 600;}
        .tab-content { display: none; padding: 20px; background: var(--card-bg); }
        .tab-content.active { display: block; }
        .tab-content pre { margin-bottom: 0; }

        /* Навигация Назад/Вперед */
        .page-nav { display: flex; justify-content: space-between; margin-top: 4em; padding-top: 2em; border-top: 1px solid var(--border-color); }
        .page-nav a { display: flex; flex-direction: column; text-decoration: none; padding: 15px 20px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); width: 48%; transition: border-color 0.2s; }
        .page-nav a:hover { border-color: var(--accent); }
        .page-nav .nav-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .page-nav .nav-title { color: var(--accent); font-weight: 600; font-size: 1rem; }
        .page-nav .next { text-align: right; align-items: flex-end; }

        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; }
            .docs-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); max-height: 300px;}
            .project-content { padding: 20px; }
            .page-nav { flex-direction: column; gap: 10px; }
            .page-nav a { width: 100%; }
        }
    </style>
</head>
<body>

<header class="project-header" id="header-bg">
    <h1 id="project-title">Название проекта</h1>
    <select id="lang-switch" class="top-lang-switch" onchange="changeLanguage(this.value)" style="background: #252525; color: #fff; border: 1px solid #333; padding: 5px; border-radius: 4px; cursor: pointer;">
        <option value="en">English</option>
        <option value="ru">Русский</option>
    </select>
</header>

<nav class="project-nav">
    <button class="nav-btn active" id="tab-about" onclick="loadTab('about')" data-i18n="tab_about">О проекте</button>
    <button class="nav-btn" id="tab-docs" onclick="loadTab('docs')" data-i18n="tab_docs">Документация</button>
    <button class="nav-btn" id="tab-changelog" onclick="loadTab('changelog')" data-i18n="tab_changelog">Изменения</button>
    <a href="#" target="_blank" class="nav-btn" id="github-link" data-i18n="tab_github">Github репозиторий</a>
</nav>

<div class="content-wrapper">
    <aside class="docs-sidebar" id="docs-sidebar">
        <div id="docs-menu-container"></div>
    </aside>

    <main class="project-content markdown-body" id="content-area">
        <p>Загрузка...</p>
    </main>
</div>

<script src="project.js"></script>
</body>
</html>
