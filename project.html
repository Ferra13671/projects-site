<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка проекта...</title>
    <link rel="icon" href="https://github.com/Ferra13671.png" type="image/png">
    <!-- Подключаем библиотеку для чтения Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-main: #e6e6e6;
            --text-muted: #9e9e9e;
            --card-bg: #252525;
            --border-color: #333333;
            --accent: #4a90e2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Шапка с обложкой */
        .project-header {
            width: 100%;
            height: 250px;
            background-color: var(--card-bg);
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 30px 40px;
        }
        .project-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(26,26,26,1) 0%, rgba(26,26,26,0.4) 100%);
            z-index: 1;
        }
        .project-header h1 {
            position: relative;
            z-index: 2;
            font-size: 2.5rem;
            font-weight: 700;
        }

                /* Навигация (Табы) */
        .project-nav {
            display: flex;
            gap: 10px;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600; /* Делаем шрифт изначально полужирным, чтобы не было прыжков */
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
            text-decoration: none; /* Для ссылки на GitHub */
        }
        .nav-btn:hover {
            color: var(--text-main);
            background-color: var(--card-bg);
        }
        .nav-btn.active {
            color: var(--accent);
            background-color: rgba(74, 144, 226, 0.1);
            /* font-weight: 600; <-- Убрали отсюда, так как перенесли в базовый класс */
        }

        /* Контентная часть */
        .project-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
        }

        /* Стили для Markdown (чтобы текст выглядел красиво) */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.5em; margin-bottom: 0.5em; color: #fff; }
        .markdown-body p { margin-bottom: 1em; }
        .markdown-body a { color: var(--accent); text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body code { background: #333; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .markdown-body pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; }
        .markdown-body pre code { background: none; padding: 0; }
        .markdown-body ul, .markdown-body ol { margin-bottom: 1em; padding-left: 20px; }
    </style>
</head>
<body>

<header class="project-header" id="header-bg">
    <h1 id="project-title">Название проекта</h1>
</header>

<nav class="project-nav">
    <button class="nav-btn active" onclick="loadTab('about', this)">О проекте</button>
    <button class="nav-btn" onclick="loadTab('docs', this)">Документация</button>
    <button class="nav-btn" onclick="loadTab('changelog', this)">Изменения</button>
    <a href="#" target="_blank" class="nav-btn" id="github-link">Github репозиторий</a>
</nav>

<main class="project-content markdown-body" id="content-area">
    <!-- Сюда будет загружаться контент -->
    <p>Загрузка...</p>
</main>

<!-- Подключаем логику страницы проекта -->
<script src="project.js"></script>
</body>
</html>
