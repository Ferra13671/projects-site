<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="i18n.js"></script>
    <link rel="icon" href="https://github.com/Ferra13671.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferra13671 Projects | Документация</title>
    <style>
        /* Базовые настройки и цвета (взяты из скриншота) */
        :root {
            --bg-color: #1a1a1a;
            --text-main: #e6e6e6;
            --text-muted: #9e9e9e;
            --card-bg: #252525;
            --card-border: #333333;
            --card-hover-border: #555555;
            --accent-color: #4a90e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Верхняя панель (Навбар) */
        header {
            display: flex;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--card-border);
            background-color: var(--bg-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .logo-container img {
            width: 28px;
            height: 28px;
            border-radius: 50%; /* Делает аватарку круглой */
        }

        /* Основной контент */
        main {
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            width: 100%;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero-section h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .projects-header {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Сетка карточек */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            align-items: start; /* Важно, чтобы карточки не растягивались по высоте соседних */
        }

        /* Карточка проекта */
        .project-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1; /* Базовый слой */
        }

        .card-image {
            width: 100%;
            height: 160px;
            background-color: #333; /* Заглушка, если картинки нет */
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0; /* Убираем отступ снизу в обычном состоянии */
            transition: margin 0.3s ease;
        }

        /* Скрытая часть карточки */
        .card-hover-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* ЭФФЕКТЫ ПРИ НАВЕДЕНИИ (HOVER) */
        .project-card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-5px); /* Приподнимаем карточку */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10; /* Поднимаем над другими карточками */
        }

        .project-card:hover .card-title {
            margin-bottom: 10px;
        }

        .project-card:hover .card-hover-content {
            max-height: 200px; /* Достаточно места для текста */
            opacity: 1;
        }

        /* Адаптив для мобильных */
        @media (max-width: 600px) {
            header { padding: 16px; }
            .projects-grid { grid-template-columns: 1fr; }
            .hero-section h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="https://github.com/Ferra13671.png" alt="Logo">
        <span data-i18n="site_title">Ferra13671 Projects</span>
    </div>
    <!-- Селектор языка -->
    <select id="lang-switch" onchange="changeLanguage(this.value)" style="background: #252525; color: #fff; border: 1px solid #333; padding: 5px; border-radius: 4px; cursor: pointer;">
        <option value="en">English</option>
        <option value="ru">Русский</option>
    </select>
</header>

<main>
    <section class="hero-section">
        <h1 data-i18n="about_site">About this site</h1>
        <p data-i18n="about_desc">This site was created...</p>
    </section>

    <h2 class="projects-header" data-i18n="projects_header">Ferra13671 Projects</h2>
    <div class="projects-grid"></div>
</main>

<script src="script.js"></script>
</body>
</html>
